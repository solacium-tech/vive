name: Build Windows executables

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build GUI executable
        run: >
          pyinstaller --onedir --noconsole --name vive_dongle_gui
          --collect-all openvr vive_dongle_gui.py

      - name: Build console executable
        run: >
          pyinstaller --onedir --console --name vive_dongle_monitor
          --collect-all openvr vive_dongle_monitor.py

      - name: Build SteamVR probe executable
        run: >
          pyinstaller --onedir --console --name steamvr_probe
          --paths . --hidden-import lighthouse_stats
          --collect-all openvr tools/steamvr_probe.py

      # The monitor is shipped on its own. The probe reads the registry and
      # launches lighthouse_console, which trips antivirus "trojan" heuristics,
      # so it is a SEPARATE artifact - downloading the monitor never pulls it
      # in, keeping that download clean.
      - name: Upload monitor (GUI + console)
        uses: actions/upload-artifact@v4
        with:
          name: vive-monitor-windows
          path: |
            dist/vive_dongle_gui
            dist/vive_dongle_monitor
          retention-days: 30

      - name: Upload SteamVR probe (separate; may trip antivirus)
        uses: actions/upload-artifact@v4
        with:
          name: vive-probe-windows
          path: dist/steamvr_probe
          retention-days: 30

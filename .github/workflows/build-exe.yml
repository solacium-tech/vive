name: Build Windows executables

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build GUI executable
        run: >
          pyinstaller --onefile --noconsole --name vive_dongle_gui
          --collect-all openvr vive_dongle_gui.py

      - name: Build console executable
        run: >
          pyinstaller --onefile --console --name vive_dongle_monitor
          --collect-all openvr vive_dongle_monitor.py

      - name: Build SteamVR probe executable
        run: >
          pyinstaller --onefile --console --name steamvr_probe
          --paths . --hidden-import lighthouse_stats
          --collect-all openvr tools/steamvr_probe.py

      # Single-file builds. The monitor ships on its own; the probe reads the
      # registry and launches lighthouse_console (antivirus "trojan" heuristic
      # bait) so it is a SEPARATE artifact - downloading the monitor never
      # pulls it in.
      - name: Upload monitor (GUI + console)
        uses: actions/upload-artifact@v4
        with:
          name: vive-monitor-windows
          path: |
            dist/vive_dongle_gui.exe
            dist/vive_dongle_monitor.exe
          retention-days: 30

      - name: Upload SteamVR probe (separate; may trip antivirus)
        uses: actions/upload-artifact@v4
        with:
          name: vive-probe-windows
          path: dist/steamvr_probe.exe
          retention-days: 30
